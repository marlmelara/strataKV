name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every preset on every OS. Correctness is not "it builds" -- it is "it
  # passes under the sanitizers", so asan and tsan are gating, not optional.
  cpp:
    name: C++ ${{ matrix.preset }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        preset: [debug, release, asan, tsan]
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Show toolchain
        run: |
          cmake --version
          ninja --version
          c++ --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # Proves the packaging chain: CMake through scikit-build-core, the extension
  # landing inside the package, and `import stratakv` working from a clean env.
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install the package
        run: python -m pip install --upgrade pip && python -m pip install '.[test]'

      - name: Acceptance check
        run: python -c "import stratakv; print(stratakv.version())"

      - name: Pytest
        run: pytest

  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # clang-format and clang-tidy come from pip at pinned versions, not from
      # apt. Ubuntu ships clang-format 18 while development happens against 21,
      # and the two disagree about real formatting decisions -- so the version
      # is pinned in one place for everybody.
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lint.txt

      - name: Tool versions
        run: |
          clang-format --version
          clang-tidy --version | head -2 | tail -1
          ruff --version

      - name: clang-format
        run: |
          find include src tests/cpp python \( -name '*.cc' -o -name '*.h' \) -print \
            | xargs clang-format --dry-run --Werror

      - name: ruff
        run: ruff check python tests/py tools && ruff format --check python tests/py tools

      # clang-tidy needs compile_commands.json, so the project is configured
      # first. The script handles the one real platform difference (macOS needs
      # an explicit SDK path) so that local and CI runs mean the same thing.
      - name: clang-tidy
        run: |
          cmake --preset debug
          ./tools/run-clang-tidy.sh build/debug
